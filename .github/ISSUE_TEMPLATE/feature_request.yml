name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: addon
    attributes:
      label: App
      options:
        - Mesh Guardian
        - Thread Anchor
        - Voice Agent Bridge
        - Side Door
        - USB/IP Link
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
