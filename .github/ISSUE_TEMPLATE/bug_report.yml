name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem! Please remove any personal information (names, addresses, passwords, tokens) before posting.
  - type: dropdown
    id: addon
    attributes:
      label: App
      options:
        - Mesh Guardian
        - Thread Anchor
        - Voice Agent Bridge
        - Side Door
        - USB/IP Link
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "x.y.z"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "year.month.patch"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup (optional)
      description: Anything about your installation that may matter, such as the devices, the web app or the hardware concerned.
  - type: textarea
    id: log
    attributes:
      label: App log
      description: "The relevant lines of the log of the app (`Settings → Apps → <app> → Log`)."
      render: text
  - type: textarea
    id: config
    attributes:
      label: App configuration
      description: Remove passwords, tokens and personal addresses.
      render: yaml
