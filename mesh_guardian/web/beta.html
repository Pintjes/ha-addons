<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh Guardian (beta)</title>
<style>
  /* Surfaces and texts follow the Home Assistant theme (copied from the parent page when
     possible); state colors are our own, chosen for AA contrast on the card. */
  :root {
    --bg: #f3f5f8; --card: #ffffff; --txt: #1a1f26; --mut: #55606e; --line: #dde2e8;
    --acc: #1f6feb; --acc-txt: #1a5fd0; --acc-soft: #e8f0fe;
    --ok: #1a7f37; --ok-soft: #e3f4e8; --warn: #8a5a00; --warn-soft: #fdf1d3;
    --bad: #c62631; --bad-soft: #fde7e9;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); --r: 12px;
  }
  :root[data-theme="dark"] {
    --bg: #111418; --card: #1c2128; --txt: #e6e9ee; --mut: #9aa5b3; --line: #2d343d;
    --acc-txt: #6ea8ff; --acc-soft: #16294a; --ok: #4cc267; --ok-soft: #12301c;
    --warn: #e0a72e; --warn-soft: #3a2c0c; --bad: #ff6b6b; --bad-soft: #3d1519; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.45 var(--ha-font, Roboto, "Segoe UI", system-ui, sans-serif); }
  button, input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  svg.i { width: 18px; height: 18px; flex: none; vertical-align: -4px; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .app { max-width: 1280px; margin: 0 auto; padding: 16px; }

  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .top h1 svg { width: 22px; height: 22px; color: var(--acc); }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--acc-soft); color: var(--acc-txt); }
  .live { font-size: 12px; color: var(--mut); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .live.poll i { background: var(--warn); }
  .top .sp { flex: 1; }
  .btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn:hover { border-color: var(--acc); }
  .btn:disabled { opacity: .6; cursor: default; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); margin: 22px 2px 8px; }

  .hero { display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; }
  .hero > div { padding: 18px 20px; }
  .verdict { display: flex; gap: 14px; align-items: flex-start; }
  .verdict .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .verdict .badge svg { width: 24px; height: 24px; }
  .verdict.ok .badge { background: var(--ok-soft); color: var(--ok); }
  .verdict.warn .badge { background: var(--warn-soft); color: var(--warn); }
  .verdict.bad .badge { background: var(--bad-soft); color: var(--bad); }
  .verdict h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
  .verdict p { margin: 4px 0 0; color: var(--mut); }
  .facts { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 22px; margin-top: 16px; justify-content: start; }
  .facts div > span { display: block; font-size: 12px; color: var(--mut); }
  .facts div b { font-size: 16px; font-weight: 600; }
  .score { border-left: 1px solid var(--line); }
  .score .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .score .big b { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .score .big .lab { font-weight: 600; }
  .score .trend { font-size: 12px; color: var(--mut); }
  .parts { margin-top: 10px; display: grid; gap: 5px; }
  .part { display: grid; grid-template-columns: 96px 1fr 52px; gap: 8px; align-items: center; font-size: 12px; }
  .part .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .part .bar i { display: block; height: 100%; border-radius: 3px; background: var(--acc); }
  .part.low .bar i { background: var(--warn); }
  .part span:last-child { text-align: right; }

  .todo { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .issue { display: flex; gap: 12px; padding: 12px 14px; text-align: left; width: 100%; border-left-width: 4px; }
  button.issue { cursor: pointer; }
  .issue.bad { border-left-color: var(--bad); } .issue.warn { border-left-color: var(--warn); } .issue.info { border-left-color: var(--acc); }
  .issue .ic { margin-top: 1px; }
  .issue.bad .ic, .issue.bad .what { color: var(--bad); }
  .issue.warn .ic, .issue.warn .what { color: var(--warn); }
  .issue.info .ic, .issue.info .what { color: var(--acc-txt); }
  .issue b { display: block; }
  .issue .what { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  .brs { display: flex; flex-wrap: wrap; gap: 8px; }
  .br { padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
  .br small { color: var(--mut); display: block; }

  .st { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .st.ok { background: var(--ok-soft); } .st.ok svg { color: var(--ok); }
  .st.bad { background: var(--bad-soft); } .st.bad svg { color: var(--bad); }
  .st.warn { background: var(--warn-soft); } .st.warn svg { color: var(--warn); }
  .st.ic { padding: 4px; }
  .sig { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sig.ok svg { color: var(--ok); } .sig.warn svg { color: var(--warn); } .sig.bad svg { color: var(--bad); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .tools input[type=search] { flex: 1 1 220px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; max-width: 100%; }
  .chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--acc-txt); font-weight: 600; }
  .chip .n { color: var(--mut); margin-left: 4px; }

  .list { overflow: hidden; }
  .cols, .row { display: grid; gap: 12px; align-items: center; padding: 0 16px;
    grid-template-columns: minmax(190px, 2fr) 128px minmax(190px, 1.7fr) 150px 92px 118px minmax(150px, 1.8fr); }
  .cols { min-height: 38px; font-size: 12px; font-weight: 600; color: var(--mut); border-bottom: 1px solid var(--line); }
  .row { min-height: 54px; padding-block: 6px; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; width: 100%; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--acc-soft); }
  .row.down { box-shadow: inset 4px 0 var(--bad); }
  .row .nm b { display: block; font-weight: 600; }
  .row small { color: var(--mut); font-size: 12px; }
  .row .lk span.p { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adv { font-size: 13px; display: flex; gap: 6px; }
  .adv.warn svg { color: var(--warn); } .adv.info svg { color: var(--acc-txt); }
  .row .lab { display: none; }
  .r { text-align: right; }
  .np { font-size: 11px; margin-left: 4px; }

  body.narrow .hero { grid-template-columns: 1fr; }
  body.narrow .score { border-left: 0; border-top: 1px solid var(--line); }
  body.narrow .facts { grid-template-columns: repeat(2, 1fr); }
  body.narrow .top .btn span { display: none; }
  body.narrow .top .btn { width: 44px; min-height: 44px; padding: 0; justify-content: center; }
  body.narrow .cols { display: none; }
  body.narrow .row { grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 14px; min-height: 64px; }
  body.narrow .row .lk { grid-column: 1; } body.narrow .row .rt { grid-column: 2; text-align: right; }
  body.narrow .row .bt, body.narrow .row .lc { font-size: 12px; color: var(--mut); }
  body.narrow .row .bt { grid-column: 1; } body.narrow .row .lc { grid-column: 2; text-align: right; }
  body.narrow .row .adv { grid-column: 1 / -1; }
  body.narrow .row .adv:empty, body.narrow .row .bt:empty { display: none; }
  body.narrow .row .lab { display: inline; color: var(--mut); }
  body.narrow .chip { min-height: 44px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 5; }
  .scrim.on { display: block; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--card); border-left: 1px solid var(--line);
    z-index: 6; overflow: auto; padding: 18px 20px 28px; transform: translateX(100%); transition: transform .18s ease; visibility: hidden; }
  .sheet.on { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet header { display: flex; gap: 10px; align-items: flex-start; }
  .sheet header h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .sheet .x { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; cursor: pointer; font-size: 20px; flex: none; }
  .sheet .x:hover { background: var(--acc-soft); }
  .sheet .advice { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; display: flex; gap: 10px; }
  .sheet .advice.warn { background: var(--warn-soft); } .sheet .advice.info { background: var(--acc-soft); } .sheet .advice.bad { background: var(--bad-soft); }
  .sheet .advice.warn svg { color: var(--warn); } .sheet .advice.info svg { color: var(--acc-txt); } .sheet .advice.bad svg { color: var(--bad); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 16px 0 0; }
  .kv div > span:first-child { display: block; font-size: 12px; color: var(--mut); }
  .chart .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mut); }
  .chart .stats b { color: var(--txt); font-size: 15px; }
  .chart svg { width: 100%; height: 96px; display: block; margin-top: 4px; }
  .chart text { font-size: 10px; fill: var(--mut); }
  .sheet ul { margin: 4px 0 0; padding-left: 18px; }
  .sheet details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  .sheet summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .sheet textarea { width: 100%; height: 55vh; background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; font: 12px monospace; margin-top: 10px; }
  .note { margin: 18px 2px 0; font-size: 12px; color: var(--mut); }
  .note summary { cursor: pointer; min-height: 32px; }
  .empty { padding: 16px; color: var(--mut); }
</style>
</head>

<div class="app">
  <div class="top">
    <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.6-3.2 8-8 9-4.8-1-8-4.4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke-linecap="round"/></svg>Mesh Guardian <span class="tag">beta</span></h1>
    <span class="live" id="live"></span>
    <span class="sp"></span>
    <button class="btn" id="refresh"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span></span></button>
    <button class="btn" id="report"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span></span></button>
    <a class="btn" id="classic" href="./"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span></span></a>
  </div>

  <section class="card hero" id="hero"><div class="empty" id="loading"></div></section>
  <h2 id="todoTitle"></h2>
  <div class="todo" id="todo"></div>
  <h2 id="brTitle"></h2>
  <div class="brs" id="brs"></div>
  <h2 id="nodesTitle"></h2>
  <div class="tools">
    <input type="search" id="q">
    <div class="chips" id="chips"></div>
  </div>
  <div class="card list">
    <div class="cols" id="cols"></div>
    <div id="rows"></div>
  </div>
  <details class="note"><summary id="noteTitle"></summary><p id="noteText"></p></details>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside>

// ------------------------------------------------------------ theme: copy the Home Assistant theme when the page can read it
function theme() {
  let dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  try {
    const ps = getComputedStyle(window.parent.document.documentElement);
    const map = {"--bg":"--primary-background-color", "--card":"--card-background-color", "--txt":"--primary-text-color",
                 "--mut":"--secondary-text-color", "--line":"--divider-color"};
    const bg = ps.getPropertyValue("--primary-background-color").trim();
    if (bg) {
      const c = document.createElement("canvas").getContext("2d"); c.fillStyle = bg;
      const h = c.fillStyle, rgb = h.startsWith("#") ? [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)) : (h.match(/\d+/g) || []).map(Number);
      if (rgb.length >= 3) dark = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) < 128;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      for (const [k, v] of Object.entries(map)) {
        const x = ps.getPropertyValue(v).trim();
        if (x) document.documentElement.style.setProperty(k, x); else document.documentElement.style.removeProperty(k);
      }
      const font = ps.getPropertyValue("--ha-font-family-body").trim() || ps.getPropertyValue("--paper-font-body1_-_font-family").trim();
      if (font) document.documentElement.style.setProperty("--ha-font", font);
      return;
    }
  } catch (e) { /* not reachable: system setting */ }
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}

let D = null, TH = {rssi_good:-75, rssi_bad:-85};
const hm = ts => new Date(ts * 1000).toLocaleTimeString(LANG, {hour:"2-digit", minute:"2-digit"});
const dt = s => new Date(s * 1000).toLocaleString(LANG, {weekday:"short", hour:"2-digit", minute:"2-digit"});
const dec = (v, n = 1) => Number(v).toLocaleString(LANG, {minimumFractionDigits:n, maximumFractionDigits:n});
function ago(ts) {
  if (!ts) return L("never");
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return F("ago_s", {n: Math.round(s)});
  if (s < 5400) return F("ago_m", {n: Math.round(s / 60)});
  if (s < 172800) return F("ago_h", {n: Math.round(s / 3600)});

}
const dur = min => min == null ? "—" : !min ? "0" : min < 90 ? min + " min" : min < 2880 ? dec(min / 60) + " h" : dec(min / 1440) + (LANG === "fr" ? " j" : " d");
const ms = v => v == null ? "—" : v < 1000 ? Math.round(v) + " ms" : dec(v / 1000) + " s";
const isRouter = r => r.role === "router" || r.role === "leader";

const linkName = r => r.parent || (isRouter(r) ? r.best_link : null);
const linkRssi = r => r.parent ? r.rssi : (isRouter(r) ? r.best_rssi : null);
const linkLqi = r => r.parent ? r.lqi : (isRouter(r) ? r.best_lqi : null);
const sigCls = v => v >= TH.rssi_good ? "ok" : v > TH.rssi_bad ? "warn" : "bad";
const sigWord = v => L("sig")[v >= TH.rssi_good ? 2 : v > TH.rssi_bad ? 1 : 0];
const sigBars = v => v >= TH.rssi_good + 10 ? 4 : v >= TH.rssi_good ? 3 : v > TH.rssi_bad ? 2 : 1;
const lvl = r => r.advice_level === "low" ? "info" : "warn";
const sev = r => !r.available ? 0 : r.advice ? (lvl(r) === "warn" ? 1 : 2) : 3;
const since = r => r.since ? hm(r.since) + " (" + ago(r.since) + ")" : "?";
const status = r => r.available ? `<span class="st ok">${IC.ok}${L("available")}</span>`
  : `<span class="st bad" title="${esc(F("unav_since", {t: since(r)}))}">${IC.bad}${L("unavailable")}</span>`;
function signal(r) {
  const v = linkRssi(r);
  if (v == null) return `<span class="mut">—</span>`;
  return `<span class="sig ${sigCls(v)}">${bars(sigBars(v))}<span class="num">${v} dBm</span> <small>${sigWord(v)}</small></span>`;
}
function battery(r) {
  if (r.battery_pct != null) return `<span class="${r.battery_pct < 20 ? "st bad" : ""}">${IC.bat} <span class="num">${r.battery_pct} %</span></span>`;
  if (r.battery_level != null) return `<span class="${r.battery_level ? "st " + (r.battery_level > 1 ? "bad" : "warn") : ""}">${IC.bat} ${esc(L("bat_level")[r.battery_level] ?? "?")}</span>`;
  return "";
}
function route(r) {
  const x = r.route;
  if (!x) return null;
  const pre = x.parent && x.parent !== x.br ? F("r_parent", {p: x.parent}) : "";
  const end = x.parent === x.br ? F("r_direct", {br: x.br}) : x.via ? F("r_via", {br: x.br, via: x.via}) : F("r_direct", {br: x.br});
  return pre + end + (x.cost ? " (" + F("r_cost", {c: x.cost}) + ")" : "");
}
function link(r) {
  const n = linkName(r);
  if (!n) return `<span class="p mut" title="${esc(L("no_parent"))}">${net(r) === "thread" ? "?" : "—"}</span>`;
  const best = !r.parent && isRouter(r);
  let np = "";
  if (r.new_parent) {
    const g = (r.rssi ?? 0) - (r.new_parent.before_rssi ?? r.rssi ?? 0);
    np = `<span class="np" title="${esc(L("new_parent") + " · " + r.new_parent.before + " (" + (r.new_parent.before_rssi ?? "?") + " dBm)")}">${g >= 6 ? "▲" : g <= -6 ? "▼" : "●"}</span>`;
  }
  const rt = route(r);
  return `<span class="p" title="${esc((best ? L("best_tip") : L("d_parent")) + (rt ? "\n" + L("to_ha") + " : " + rt : ""))}">${best ? "↔ " : ""}${esc(n)}${np}</span>`;
}

function renderHero() {

  const cls = down.length ? "bad" : act.length ? "warn" : "ok";
  const parts = [];

  const title = parts.length ? parts.join(", ") : L("all_ok");
  const sub = down.length === 1 ? F("down_sub", {name: esc(down[0].name), t: since(down[0])})
    : down.length ? F("down_sub_pl", {name: esc(down[0].name), n: down.length - 1}) : act.length ? L("act_sub") : L("all_ok_sub");
  const nets = Object.keys(NETS).filter(k => rows.some(r => net(r) === k));

  let score = `<span class="mut" style="font-size:12px">${L("q_wait")}</span>`;
  if (q && q.score != null) {
    const lab = L("q_lab")[q.score >= 95 ? 3 : q.score >= 90 ? 2 : q.score >= 80 ? 1 : 0];
    const d = q.score_24h != null && q.minutes >= 30 ? q.score - q.score_24h : null;
    const trend = d != null && Math.abs(d) >= .1 ? F("q_trend", {d: (d > 0 ? "▲ +" : "▼ ") + dec(d)}) + " · " : "";

        <span>${esc(L("q_parts")[k] || k)}</span><span class="bar"><i style="width:${Math.max(0, Math.min(100, v))}%"></i></span><span class="num">${dec(v)} %</span></div>`).join("")}</div>`;
  }
  $("#hero").innerHTML = `<div><div class="verdict ${cls}"><span class="badge">${cls === "ok" ? IC.ok : cls === "bad" ? IC.bad : IC.warn}</span>
      <div><h3>${title}</h3><p>${sub}</p></div></div>

function chart(pts, unit, color, warn) {
  const v = pts.filter(p => p[1] != null);
  if (!v.length) return `<p class="mut">—</p>`;
  const vals = v.map(p => p[1]), cur = vals[vals.length - 1];
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length, mn = Math.min(...vals), mx = Math.max(...vals);
  let lo = Math.min(mn, warn ?? Infinity), hi = Math.max(mx, warn ?? -Infinity);
  const pad = Math.max(1, (hi - lo) * .12); lo -= pad; hi += pad;
  const t0 = v[0][0], t1 = Math.max(v[v.length - 1][0], t0 + 1);
  const W = 440, H = 96, L0 = 46, B = 16;
  const X = t => L0 + (t - t0) / (t1 - t0) * (W - L0 - 6), Y = y => 6 + (hi - y) / (hi - lo) * (H - B - 6);
  const fmt = x => unit === "ms" ? ms(x) : Math.round(x) + " " + unit;
  const ticks = [...new Set([mx, (mx + mn) / 2, mn].map(x => fmt(x)))].map(s => [s, [mx, (mx + mn) / 2, mn].find(x => fmt(x) === s)]);
  return `<div class="chart"><div class="stats"><span>${L("now")} <b class="num">${fmt(cur)}</b></span><span>${L("average")} ${fmt(avg)}</span><span>min ${fmt(mn)}</span><span>max ${fmt(mx)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L("now") + " " + fmt(cur) + ", " + L("average") + " " + fmt(avg))}">
    ${ticks.map(([s, t]) => `<line x1="${L0}" x2="${W - 6}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L0 - 5}" y="${Y(t) + 3}" text-anchor="end">${s}</text>`).join("")}
    ${warn != null ? `<line x1="${L0}" x2="${W - 6}" y1="${Y(warn)}" y2="${Y(warn)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${L0 + 4}" y="${Y(warn) + 11}" style="fill:var(--bad)">${L("threshold")} ${warn}</text>` : ""}
    ${v.length > 1 ? `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${v.map(p => X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(" ")}"/>` : ""}
    ${v.map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="5" fill="transparent"><title>${dt(p[0])} : ${fmt(p[1])}</title></circle>`).join("")}
    <circle cx="${X(v[v.length - 1][0])}" cy="${Y(cur)}" r="3.5" fill="${color}"/>
    <text x="${L0}" y="${H - 2}">${dt(t0)}</text><text x="${W - 6}" y="${H - 2}" text-anchor="end">${dt(t1)}</text></svg></div>`;
}

  const best = !r.parent && isRouter(r);
  const power = r.battery ? L("battery") + (r.battery_pct != null ? " " + r.battery_pct + " %" : r.battery_level != null ? " · " + L("bat_level")[r.battery_level] : "") : L("mains");
  const kv = [[L("d_net"), NETS[net(r)]], [L("d_role"), r.role ? esc(L("roles")[r.role] || r.role) : "—"],
    [best ? L("d_best") : L("d_parent"), esc(linkName(r) || "—")], [L("d_signal"), signal(r)],
    [L("d_lqi"), linkLqi(r) ?? "—"],
    ...(net(r) === "thread" ? [[L("to_ha"), `<span title="${esc(L("r_cost_tip"))}">${esc(route(r) || L("r_unknown"))}</span>`]] : []), [L("d_resp"), `${r.rtt_fail ? L("no_answer") : ms(r.rtt_ms)} · ${ms(r.rtt_avg_ms)}`],
    [L("d_power"), esc(power)], [L("d_last"), r.last_report ? ago(r.last_report) + (r.contact_src ? ` <small class="mut">(${esc(L("csrc")[r.contact_src] || r.contact_src)})</small>` : "") : L("never")]];
  const c = v => v == null ? "—" : v;
  const tech = [[L("t_id"), esc(r.id)], [L("t_rloc"), esc(r.rloc16 || "—")], [L("t_nb"), c(r.neighbors)], [L("t_weak"), c(r.weak)],
    [L("t_det"), c(r.detaches_24h)], [L("t_pch"), c(r.parent_changes_24h)], [L("t_partch"), c(r.partition_changes_24h)],
    [L("t_out"), `${c(r.outages_24h)} · ${c(r.outages_7d)}`], [L("t_down"), dur(r.downtime_7d_min)], [L("t_reb"), `${c(r.reboots)} · ${c(r.reboots_24h)}`],
    [L("t_boot"), r.boot_reason == null ? "—" : esc(L("boot")[r.boot_reason] || r.boot_reason)], [L("t_up"), r.uptime_h == null ? "—" : dur(Math.round(r.uptime_h * 60))],
    [L("t_src"), r.contact_src ? esc(L("csrc")[r.contact_src] || r.contact_src) : "—"], [L("t_gap"), r.active_gap_max_s == null ? "—" : dur(Math.round(r.active_gap_max_s / 60))]];
  const top = head(esc(r.name), [r.area, r.model].filter(Boolean).map(esc).join(" · "), `<div style="margin-top:8px">${status(r)}</div>`) + adv + grid(kv);
  const techBlock = `<details><summary>${L("tech")}</summary>${grid(tech)}</details>`;
  openSheet(top + `<p class="mut">${L("loading")}</p>` + techBlock);
  try {
    const d = await (await fetch("api/node?id=" + encodeURIComponent(id), {cache: "no-store"})).json();
    if (!$("#sheet").classList.contains("on")) return;
    const s = d.series || [];
    const out = (d.outages || []).slice(-15).reverse().map(o => `<li>${dt(o[0])} → ${o[1] ? dt(o[1]) : L("ongoing")}</li>`).join("");
    const pc = (d.parent_changes || []).slice(-15).reverse().map(x => `<li>${dt(x[0])} : ${esc(x[1])} → ${esc(x[2])}</li>`).join("");
    const signalChart = net(r) === "ethernet" ? "" : `<h2>${L("sig7")}</h2>${chart(s.map(x => [x[0], x[3]]), "dBm", "var(--acc)", net(r) === "thread" ? TH.rssi_bad : null)}`;
    $("#sheet").innerHTML = top + (s.length < 2 ? `<p class="mut">${L("hist_wait")}</p>` : "") + signalChart +
      `<h2>${L("resp7")}</h2>${chart(s.map(x => [x[0], x[4]]), "ms", "var(--warn)")}` +
      `<h2>${L("outages")}</h2>${out ? `<ul>${out}</ul>` : `<p class="mut">${L("none")}</p>`}` +
      (net(r) === "thread" ? `<h2>${L("pchanges")}</h2>${pc ? `<ul>${pc}</ul>` : `<p class="mut">${L("none")}</p>`}` : "") + techBlock;
  } catch (e) {
    $("#sheet").innerHTML = top + `<p class="mut">${L("error")}</p>` + techBlock;
  }
}

async function openReport() {
  openSheet(head(L("report"), L("report_tip")) + `<p class="mut">${L("loading")}</p>`);
  try {
    const txt = await (await fetch("api/report", {cache: "no-store"})).text();
    $("#sheet").innerHTML = head(L("report"), L("report_tip")) +
      `<p style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="rcopy">${L("copy")}</button><button class="btn" id="rdl">${L("download")}</button></p><textarea id="rtext" readonly></textarea>`;
    $("#rtext").value = txt;
    $("#rcopy").onclick = async () => {
      try { await navigator.clipboard.writeText(txt); } catch (e) { $("#rtext").select(); document.execCommand("copy"); }
      $("#rcopy").textContent = L("copied");
    };
    $("#rdl").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([txt], {type: "text/markdown"}));
      a.download = "mesh-guardian-report.md"; document.body.appendChild(a); a.click(); a.remove();
    };
  } catch (e) { $("#sheet").innerHTML = head(L("report")) + `<p class="mut">${L("error")}</p>`; }
}

// ------------------------------------------------------------ loading
function texts() {
  document.documentElement.lang = LANG;
  $("#refresh span").textContent = L("refresh"); $("#refresh").title = L("refresh");
  $("#report span").textContent = L("report"); $("#report").title = L("report_tip");
  $("#classic span").textContent = L("classic"); $("#classic").title = L("classic");
  $("#q").placeholder = L("search"); $("#q").setAttribute("aria-label", L("search"));
  $("#noteTitle").textContent = L("note_t"); $("#noteText").textContent = L("note");
  $("#sheet").setAttribute("aria-label", L("h_node"));
}
function renderAll() {
  if (!D) return;
  renderHero(); renderTodo(); renderBrs(); renderList();
  $("#live").className = "live" + (D.live ? "" : " poll");
  $("#live").title = D.live ? L("live") : L("polling");
  $("#live").innerHTML = `<i></i>${F("updated", {t: hm(D.time)})}`;
}
let busy = false;
async function load(force) {
  if (busy) return; busy = true;
  if (force) $("#refresh").disabled = true;
  try {
    const r = await fetch("api/table" + (force ? "?force=1" : ""), {cache: "no-store"});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    D = d; TH = d.thresholds || TH;
    if (d.lang && d.lang !== LANG) { LANG = d.lang; texts(); }
    theme(); renderAll();
  } catch (e) {
    $("#live").className = "live poll"; $("#live").innerHTML = `<i></i>${L("error")}: ${esc(e.message)}`;
    if (!D) $("#hero").innerHTML = `<div class="empty">${L("error")}: ${esc(e.message)}</div>`;
  } finally { busy = false; $("#refresh").disabled = false; }
}

// ------------------------------------------------------------ events
document.addEventListener("click", e => {
  const t = e.target.closest("[data-id],[data-f],.x");
  if (!t) return;
  if (t.classList.contains("x")) return closeSheet();
  if (t.dataset.f) { P.filter = t.dataset.f; save(); return renderList(); }
  if (t.dataset.id) return openNode(t.dataset.id);
});
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#q").value = P.q;
$("#q").addEventListener("input", () => { P.q = $("#q").value; save(); if (D) renderList(); });
$("#refresh").addEventListener("click", () => load(true));
$("#report").addEventListener("click", openReport);
$("#classic").addEventListener("click", () => { try { localStorage.setItem("mesh_guardian_ui", "classic"); } catch (e) { /* storage unavailable */ } });
try { localStorage.setItem("mesh_guardian_ui", "beta"); } catch (e) { /* storage unavailable */ }
const layout = () => document.body.classList.toggle("narrow", window.innerWidth <= 760);
window.addEventListener("resize", layout);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);
layout(); theme(); texts();
$("#loading").textContent = L("loading");
load(false);
setInterval(() => { if (!document.hidden) load(false); }, 60000);
setInterval(() => { if (D && !document.hidden) { renderHero(); renderTodo(); renderBrs(); renderList(); } }, 30000);
</script>
</body>
</html>
