<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesh Guardian</title>
<style>
  /* Surfaces and texts follow the Home Assistant theme (copied from the parent page when
     possible); state colors are our own, chosen for AA contrast on the card. */
  :root {
    --bg: #f3f5f8; --card: #ffffff; --txt: #1a1f26; --mut: #55606e; --line: #dde2e8;
    --acc: #1f6feb; --acc-txt: #1a5fd0; --acc-soft: #e8f0fe;
    --ok: #1a7f37; --ok-soft: #e3f4e8; --warn: #8a5a00; --warn-soft: #fdf1d3;
    --bad: #c62631; --bad-soft: #fde7e9;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08); --r: 12px;
  }
  :root[data-theme="dark"] {
    --bg: #111418; --card: #1c2128; --txt: #e6e9ee; --mut: #9aa5b3; --line: #2d343d;
    --acc-txt: #6ea8ff; --acc-soft: #16294a; --ok: #4cc267; --ok-soft: #12301c;
    --warn: #e0a72e; --warn-soft: #3a2c0c; --bad: #ff6b6b; --bad-soft: #3d1519; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.45 var(--ha-font, Roboto, "Segoe UI", system-ui, sans-serif); }
  button, input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--mut); }
  svg.i { width: 18px; height: 18px; flex: none; vertical-align: -4px; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .app { max-width: 1280px; margin: 0 auto; padding: 16px; }

  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .top h1 svg { width: 22px; height: 22px; color: var(--acc); }
  .live { font-size: 12px; color: var(--mut); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .live.poll i { background: var(--warn); }
  .live.reading i { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .live.reading i { animation: none; } }
  .top .sp { flex: 1; }
  .btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .btn:hover { border-color: var(--acc); }
  .btn:disabled { opacity: .6; cursor: default; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); margin: 22px 2px 8px; }

  .hero { display: grid; grid-template-columns: 1.3fr 1fr; overflow: hidden; }
  .hero > div { padding: 18px 20px; }
  .verdict { display: flex; gap: 14px; align-items: flex-start; }
  .verdict .badge { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .verdict .badge svg { width: 24px; height: 24px; }
  .verdict.ok .badge { background: var(--ok-soft); color: var(--ok); }
  .verdict.warn .badge { background: var(--warn-soft); color: var(--warn); }
  .verdict.bad .badge { background: var(--bad-soft); color: var(--bad); }
  .verdict.info .badge { background: var(--acc-soft); color: var(--acc-txt); }
  .adv.warn svg { color: var(--acc-txt) !important; }
  .sheet .advice.warn { background: var(--acc-soft) !important; }
  .sheet .advice.warn svg { color: var(--acc-txt) !important; }
  .verdict h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
  .verdict p { margin: 4px 0 0; color: var(--mut); }
  .facts { display: grid; grid-template-columns: repeat(4, auto); gap: 8px 22px; margin-top: 16px; justify-content: start; }
  .facts div > span { display: block; font-size: 12px; color: var(--mut); }
  .facts div b { font-size: 16px; font-weight: 600; }
  .score { border-left: 1px solid var(--line); }
  .score .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .score .big b { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .score .big .lab { font-weight: 600; }
  .score .trend { font-size: 12px; color: var(--mut); }
  .parts { margin-top: 10px; display: grid; gap: 5px; }
  .part { display: grid; grid-template-columns: 96px 1fr 52px; gap: 8px; align-items: center; font-size: 12px; }
  .part .bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
  .part .bar i { position: absolute; left: 0; top: 0; }
  .part .bar u { position: absolute; top: -3px; width: 2px; height: 12px; margin-left: -1px; background: var(--txt); opacity: .55; border-radius: 1px; }
  .legend24 { display: inline-flex; align-items: center; gap: 5px; }
  .legend24 u { display: inline-block; width: 2px; height: 11px; background: var(--txt); opacity: .55; }
  .part .bar i { display: block; height: 100%; border-radius: 3px; background: var(--acc); }
  .part.low .bar i { background: var(--warn); }
  .part .bar b { position: absolute; top: 0; height: 100%; }
  .part .bar b.gain { background: var(--ok); }
  .part .bar b.loss { background: var(--bad); opacity: .85; }
  .part span:last-child { text-align: right; }

  .todo { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 10px; }
  .issue { display: flex; gap: 12px; padding: 12px 14px; text-align: left; width: 100%; border-left-width: 4px; }
  button.issue, .issue[data-id] { cursor: pointer; }
  .issue.bad { border-left-color: var(--bad); } .issue.warn { border-left-color: var(--warn); } .issue.info { border-left-color: var(--acc); }
  .issue .ic { margin-top: 1px; }
  .issue .seen { align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; color: var(--mut); cursor: pointer; }
  .issue .seen:hover { color: var(--txt); border-color: var(--mut); }
  .issue.bad .ic, .issue.bad .what { color: var(--bad); }
  .issue.warn .ic, .issue.warn .what { color: var(--warn); }
  .issue.info .ic, .issue.info .what { color: var(--acc-txt); }
  .issue b { display: block; }
  button.open { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-align: inherit; cursor: pointer; }
  .issue .what { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  .brs { display: flex; flex-wrap: wrap; gap: 8px; }
  .br { padding: 8px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .br small { color: var(--mut); display: block; }

  .st { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 6px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .st.ok { background: var(--ok-soft); } .st.ok svg { color: var(--ok); }
  .st.bad { background: var(--bad-soft); } .st.bad svg { color: var(--bad); }
  .st.warn { background: var(--warn-soft); } .st.warn svg { color: var(--warn); }
  .st.ic { padding: 4px; }
  .sig { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sig.ok svg { color: var(--ok); } .sig.warn svg { color: var(--warn); } .sig.bad svg { color: var(--bad); }
  .old, .old * { color: var(--mut) !important; }   /* a value the node gave too long ago: never shown as current */

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .tools input[type=search] { flex: 1 1 220px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; max-width: 100%; }
  .chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--acc-soft); border-color: var(--acc); color: var(--acc-txt); font-weight: 600; }
  .chip .n { color: var(--mut); margin-left: 4px; }

  .list { overflow: visible; }
  .list .row:last-child { border-radius: 0 0 var(--r) var(--r); }
  .cols, .row { display: grid; gap: 12px; align-items: center; padding: 0 16px;
    grid-template-columns: var(--gt, minmax(190px, 2fr) 128px minmax(190px, 1.7fr) 150px 92px 118px minmax(150px, 1.8fr)); }
  .list { position: relative; }
  .colset { position: absolute; top: 4px; right: 6px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none;
    color: var(--mut); cursor: pointer; display: grid; place-items: center; z-index: 2; }
  .colset:hover, .colset[aria-expanded="true"] { background: var(--acc-soft); color: var(--acc-txt); }
  .colmenu { position: absolute; top: 38px; right: 6px; z-index: 3; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 8px 4px; min-width: 230px; max-height: 60vh; overflow: auto; display: none; }
  .colmenu.on { display: block; }
  .colmenu label { display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 34px; cursor: pointer; border-radius: 6px; }
  .colmenu label:hover { background: var(--acc-soft); }
  .colmenu label.fixed { opacity: .55; cursor: default; }
  .colmenu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 8px; }
  .colmenu .reset { all: unset; cursor: pointer; display: block; padding: 6px 12px; color: var(--acc-txt); font-size: 13px; }
  body:not(.narrow) .cols, body:not(.narrow) .row { min-width: var(--minw, 0); }
  .tools { position: relative; }
  .tools .colset { position: static; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); flex: none; }
  .tools .colmenu { top: calc(100% + 6px); right: 0; }
  .pw { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .bat-ok { color: var(--ok); } .bat-warn { color: var(--warn); } .bat-bad { color: var(--bad); }
  .scroll { overflow-x: auto; border-radius: var(--r); }
  body.narrow .colset, body.narrow .colmenu { display: none; }
  .st + .rl { display: block; font-size: 12px; color: var(--mut); margin-top: 3px; padding-left: 4px; }
  .cols [draggable="true"] { cursor: grab; }
  .cols .drop { box-shadow: inset 2px 0 var(--acc); }
  .colmenu .drop { box-shadow: inset 0 2px var(--acc); }
  .dragging { opacity: .45; }
  .colmenu .grip { color: var(--mut); cursor: grab; font-size: 12px; letter-spacing: -2px; }
  .row > .x0 { font-variant-numeric: tabular-nums; }
  body.narrow .row > .x0 { display: none; }
  .cols { min-height: 38px; font-size: 12px; font-weight: 600; color: var(--mut); border-bottom: 1px solid var(--line); }
  .cols button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; min-height: 38px; border-radius: 4px; }
  .cols button:hover, .cols button.on { color: var(--txt); }
  .cols button:focus-visible { outline: 2px solid var(--acc); }
  .cols .r button { justify-content: flex-end; width: 100%; }
  .row { min-height: 54px; padding-block: 6px; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; width: 100%; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--acc-soft); }
  .row.down { box-shadow: inset 4px 0 var(--bad); }
  .row .nm b { display: block; font-weight: 600; }
  .row small { color: var(--mut); font-size: 12px; }
  .row .lk span.p { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .new { font-size: 11px; font-weight: 600; color: var(--acc-txt); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; }
  .adv { font-size: 13px; display: flex; gap: 6px; }
  .adv.warn svg { color: var(--warn); } .adv.info svg { color: var(--acc-txt); }
  .row .lab { display: none; }
  .r { text-align: right; }
  .np { font-size: 11px; margin-left: 4px; }

  body.narrow .hero { grid-template-columns: 1fr; }
  body.narrow .score { border-left: 0; border-top: 1px solid var(--line); }
  body.narrow .facts { grid-template-columns: repeat(2, 1fr); }
  body.narrow .top .btn span { display: none; }
  body.narrow .top .btn { width: 44px; min-height: 44px; padding: 0; justify-content: center; }
  body.narrow .acts { grid-template-columns: repeat(2, 36px); }
  body.narrow .act { width: 36px; height: 36px; }
  body.narrow .cols { display: none; }
  body.narrow .row { grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 14px; min-height: 64px; }
  body.narrow .row .lk { grid-column: 1; } body.narrow .row .rt { grid-column: 2; text-align: right; }
  body.narrow .row .bt, body.narrow .row .lc { font-size: 12px; color: var(--mut); }
  body.narrow .row .bt { grid-column: 1; } body.narrow .row .lc { grid-column: 2; text-align: right; }
  body.narrow .row .adv { grid-column: 1 / -1; }
  body.narrow .row .adv:empty, body.narrow .row .bt:empty { display: none; }
  body.narrow .row .lab { display: inline; color: var(--mut); }
  body.narrow .chip { min-height: 44px; }

  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 5; }
  .scrim.on { display: block; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--card); border-left: 1px solid var(--line);
    z-index: 6; overflow: auto; padding: 18px 20px 28px; transform: translateX(100%); transition: transform .18s ease; visibility: hidden; }
  .sheet.on { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
  .sheet header { display: flex; gap: 10px; align-items: flex-start; }
  .sheet header h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .sheet .x { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; cursor: pointer; font-size: 20px; flex: none; }
  .sheet .x:hover { background: var(--acc-soft); }
  .sheet .advice { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; display: flex; gap: 10px; }
  .sheet .advice.warn { background: var(--warn-soft); } .sheet .advice.info { background: var(--acc-soft); } .sheet .advice.bad { background: var(--bad-soft); }
  .sheet .advice.warn svg { color: var(--warn); } .sheet .advice.info svg { color: var(--acc-txt); } .sheet .advice.bad svg { color: var(--bad); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 16px 0 0; }
  .kv div > span:first-child { display: block; font-size: 12px; color: var(--mut); }
  .chart .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mut); }
  .chart .stats b { color: var(--txt); font-size: 15px; }
  .chart svg { width: 100%; height: 96px; display: block; margin-top: 4px; }
  .chart text { font-size: 10px; fill: var(--mut); }
  .sheet ul { margin: 4px 0 0; padding-left: 18px; }
  .sheet details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  .sheet summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .sheet textarea { width: 100%; height: 55vh; background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; font: 12px monospace; margin-top: 10px; }
  .apf { display: flex; gap: 6px; margin-bottom: 2px; }
  .apf input { flex: 1; min-width: 0; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 8px; }
  .apf .btn { min-height: 36px; padding: 0 10px; }
  .kv div:has(.apf) { grid-column: 1 / -1; }
  .pczone { display: flex; align-items: center; justify-content: center; height: 64px; margin-top: 8px; border: 2px dashed var(--line);
    border-radius: 10px; color: var(--mut); cursor: pointer; }
  .pczone svg { width: 30px; height: 30px; }
  .pczone:hover, .pcdrop.over .pczone { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-txt); }
  /* sections of a panel: they fold with their arrow; the groups of the technical details too */
  .sheet details.sec { margin-top: 14px; padding-top: 8px; }
  .sheet details.sec > summary { font-size: 14px; }
  .sheet details.sec > :nth-child(2) { margin-top: 4px; }
  .sheet details.sec .sub + .kv { margin-top: 2px; margin-bottom: 6px; }
  .sheet details.sec .histnone:first-of-type { margin-top: 2px; }
  .sheet details.sec .sheet-acts { margin-top: 6px; }
  .pcline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .pcline .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; cursor: pointer; color: var(--txt); }
  .pcline .btn.quiet { border-color: transparent; background: none; color: var(--mut); padding: 0 6px; }
  .pcline .btn.quiet:hover { color: var(--txt); }
  .pcline.pcsub { margin-top: 2px; gap: 2px 14px; }
  .pcline.pcsub .btn { min-height: 32px; padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .pcline .pccode { margin: 0 4px 0 0; }
  .pccard.sm { margin-top: 8px; align-items: flex-start; }
  .pccard.sm .qrbox { width: 116px; height: 116px; }
  .pccard.sm .pcline:first-child { margin-top: 2px; }
  .sheet details.more { margin: 2px 0 0; border: 0; padding: 0; }
  .sheet details.more summary { font-weight: 400; color: var(--mut); font-size: 13px; min-height: 28px; }
  #pair > small { display: block; margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .ftag { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut); white-space: nowrap; }
  .kv .wide { grid-column: 1 / -1; }
  .kv.kv3 { grid-template-columns: repeat(3, 1fr); }
  .sheet .sub { margin: 14px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); }
  .sheet summary + .sub { margin-top: 6px; }
  .histnone { margin: 6px 0 8px; color: var(--mut); }
  .sheet-acts.danger { margin-top: 12px; }
  .sheet-acts.danger .act { color: var(--mut); }
  .sheet-acts.danger .act:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  .pcf, .pca { display: flex; gap: 6px; margin-top: 8px; }
  .pcf input, .pca select { flex: 1; min-width: 0; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); padding: 0 8px; }
  .pcf .btn, .pca .btn, .pcbtns .btn, .pccard .btn { min-height: 36px; padding: 0 10px; }
  .pccard { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
  .pccard .qrbox { width: 132px; height: 132px; flex: none; }
  .pccard .qr { width: 100%; height: 100%; display: block; border-radius: 6px; }
  .pccode { font: 600 19px ui-monospace, monospace; user-select: all; display: inline-block; margin: 2px 0 6px; }
  .pcbtns { display: flex; gap: 8px; margin: 10px 0 0; }
  .nmf label { display: block; margin-top: 14px; font-size: 12px; color: var(--mut); }
  .nmf input, .nmf select { display: block; width: 100%; box-sizing: border-box; min-height: 40px; margin-top: 4px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--txt); padding: 0 8px; font-size: 15px; }
  .nmf .btn.x { width: auto; height: auto; min-height: 36px; border: 1px solid var(--line); border-radius: 10px; font-size: inherit; margin: 0; }
  .sheet-acts .act[data-reset]:hover:not(:disabled), .btn.danger:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  .rsok { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; cursor: pointer; }
  .acts { display: inline-grid; grid-template-columns: repeat(2, 28px); gap: 4px; }
  .act[data-act="remove"]:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
  .act { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--mut);
    display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
  .act:hover:not(:disabled) { color: var(--acc-txt); border-color: var(--acc); }
  .act:disabled { opacity: .35; cursor: default; }
  .act.busy { opacity: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .act.busy { animation: none; } }
  .sheet-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .sheet-acts .act { width: auto; height: 40px; padding: 0 12px; display: inline-flex; gap: 6px; color: var(--txt); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: var(--txt); color: var(--card); padding: 10px 16px; border-radius: 10px; max-width: min(92vw, 560px); z-index: 9;
    transition: opacity .2s, transform .2s; font-size: 13.5px; }
  #toast.on { opacity: 1; transform: translateX(-50%); pointer-events: auto; cursor: pointer; }
  .row { display: grid; }
  .note { margin: 18px 2px 0; font-size: 12px; color: var(--mut); }
  .note summary { cursor: pointer; min-height: 32px; }
  .empty { padding: 16px; color: var(--mut); }
</style>
</head>
<body>
<div class="app">

// ------------------------------------------------------------ theme: copy the Home Assistant theme when the page can read it
function theme() {
  let dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  try {
    const ps = getComputedStyle(window.parent.document.documentElement);
    const map = {"--bg":"--primary-background-color", "--card":"--card-background-color", "--txt":"--primary-text-color",
                 "--mut":"--secondary-text-color", "--line":"--divider-color"};
    const bg = ps.getPropertyValue("--primary-background-color").trim();
    if (bg) {
      const c = document.createElement("canvas").getContext("2d"); c.fillStyle = bg;
      const h = c.fillStyle, rgb = h.startsWith("#") ? [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)) : (h.match(/\d+/g) || []).map(Number);
      if (rgb.length >= 3) dark = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) < 128;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      for (const [k, v] of Object.entries(map)) {
        const x = ps.getPropertyValue(v).trim();
        if (x) document.documentElement.style.setProperty(k, x); else document.documentElement.style.removeProperty(k);
      }
      const font = ps.getPropertyValue("--ha-font-family-body").trim() || ps.getPropertyValue("--paper-font-body1_-_font-family").trim();
      if (font) document.documentElement.style.setProperty("--ha-font", font);
      return;
    }
  } catch (e) { /* not reachable: system setting */ }
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}

async function readQr(file) {
  const bmp = await createImageBitmap(file);
  if ("BarcodeDetector" in window) {
    try {
      const found = await new BarcodeDetector({formats: ["qr_code"]}).detect(bmp);
      const m = found.find(x => /MT:/i.test(x.rawValue)) || found[0];

  await needScript("jsqr.js");

  for (const max of [1600, 1000, 2400, 600]) {

    if (done.has(w)) continue;

    const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h);

// Pair a device without leaving the page. A new or reset device only speaks Bluetooth, so the
// phone does it: in the Home Assistant app this starts the same pairing as its "Add Matter
// device" screen (the app is asked through the Home Assistant page this one is shown in, with
// the Thread network Home Assistant prefers). Elsewhere, that screen of Home Assistant opens.
// code: copied first, to paste in the pairing screen instead of scanning the label.
// The Home Assistant app has a QR code reader of its own (live, no photo). The Home Assistant
// page this one is shown in talks to the app; the answer of the reader comes back to that
// page, so its handler of app messages is wrapped for the time of one scan, then put back.
// This leans on how the Home Assistant frontend is built: checked before each use, and the
// photo stays as the other way.
const appBus = () => {
  try { const hass = window.parent.document.querySelector("home-assistant").hass; return {hass, ext: hass.auth && hass.auth.external}; }
  catch (e) { return {}; }   // not inside Home Assistant
};

// the page is left during a scan (other page of Home Assistant, app sent to the background):
// the handler of Home Assistant is given back, or its own next scan would not get its result
window.addEventListener("pagehide", () => { if (scanEnd) scanEnd({aborted: "left"}); if (watching) watching.stop(); });

  const {ext} = appBus();
  if (scanEnd) return Promise.resolve({aborted: "busy"});
  return new Promise(done => {
    const orig = ext._commandHandler;
    let over = false, mine = null;
    const end = v => {
      if (over) return;

      if (ext._commandHandler === mine) ext._commandHandler = orig;   // not if Home Assistant replaced it meanwhile
      try { ext.fireMessage({type: "bar_code/close"}); } catch (e) { /* closed already */ }
      done(v);
    };
    scanEnd = end;
    ext._commandHandler = mine = msg => {
      if (over || (msg.command !== "bar_code/scan_result" && msg.command !== "bar_code/aborted")) return orig(msg);
      try { ext.fireMessage({id: msg.id, type: "result", success: true, result: null}); } catch (e) { /* the app does not wait for it */ }
      const p = msg.payload || {};
      if (msg.command === "bar_code/aborted") end({aborted: p.reason || "canceled"});
      else if (/MT:/i.test(p.rawValue || "")) end({text: p.rawValue});
      else { try { ext.fireMessage({type: "bar_code/notify", payload: {message: L("sc_wrong")}}); } catch (e) { /* keeps scanning */ } }
      return true;
    };

    catch (e) { end({aborted: "error"}); }

async function watchNewDevice(hass, known) {
  if (watching) watching.stop();   // a new pairing replaces the watch of the previous one
  // Home Assistant says when a device is added to its registry: the registry is read then (and
  // once a minute in case a message was missed), not every few seconds for ten minutes
  const w = watching = {over: false, kick: false, wake: null};
  const poke = () => { if (w.wake) { const f = w.wake; w.wake = null; f(); } else w.kick = true; };
  w.stop = () => { w.over = true; poke(); };
  let suggested = null, unsub = null;   // suggested: the name typed in the pairing screen of the phone, when it gives one
  const onFinish = ev => { if (ev.detail && ev.detail.name) suggested = ev.detail.name; poke(); };
  try { window.parent.addEventListener("matter-commission-finish", onFinish); } catch (e) { /* no suggestion */ }
  try { unsub = await hass.connection.subscribeEvents(ev => { if ((ev.data || {}).action === "create") poke(); }, "device_registry_updated"); }
  catch (e) { unsub = null; }   // not offered: the registry is read every 15 seconds
  const nap = ms => new Promise(r => {
    if (w.kick || w.over) { w.kick = false; return r(); }
    w.wake = r; setTimeout(() => { if (w.wake === r) w.wake = null; r(); }, ms);
  });
  const end = Date.now() + 10 * 60e3;
  let dev = null;
  while (!dev && !w.over && Date.now() < end) {
    await nap(unsub ? 60000 : 15000);
    if (!w.over) dev = ((await matterDevices(hass)) || []).find(d => !known.has(d.id));
  }
  try { window.parent.removeEventListener("matter-commission-finish", onFinish); } catch (e) { /* nothing to remove */ }
  if (unsub) { try { Promise.resolve(unsub()).catch(() => {}); } catch (e) { /* closed already */ } }
  if (watching === w) watching = null;
  if (!dev || w.over) return;
  for (let i = 0; i < 60 && panelBusy(); i++) await new Promise(r => setTimeout(r, 2000));   // not over what the user is typing
  naming = {hass, dev};
  const areas = Object.values(hass.areas || {}).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  openId = null; pair = {id: null, data: null, edit: false};

      <label>${L("nm_area")}<select name="a"><option value="">—</option>${areas.map(a =>
        `<option value="${esc(a.area_id)}"${a.area_id === dev.area_id ? " selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
      <p class="pcbtns"><button class="btn">${L("save")}</button><button class="btn x" type="button">${L("nm_later")}</button></p></form>`);

    } catch (e) { /* the phone then uses the Thread network it knows */ }
    try {
      const before = await matterDevices(hass);
      ext.fireMessage(payload ? {type: "matter/commission", payload} : {type: "matter/commission"});
      toast(said("pa_started"), code && !copied);
      if (before) watchNewDevice(hass, new Set(before.map(d => d.id)));   // then its name and area are asked here
      for (const s of [30, 60, 120, 180, 300]) setTimeout(() => { if (!document.hidden) load(true); }, s * 1000);   // the new node shows up by itself
      return;
    } catch (e) { /* the screen of Home Assistant below */ }
  }
  toast(said("pa_screen"), code && !copied);
  setTimeout(() => { try { window.top.location.assign("/config/matter/add"); } catch (e) { toast(L("pa_none")); } }, code ? 1200 : 300);
}
async function openCodes() {   // codes of the devices that left the table: what is needed to pair them again
  openId = null; pair = {id: null, data: null, edit: false};
  openSheet(head(L("pc_list"), L("pc_list_tip")) + `<p class="mut">${L("loading")}</p>`);
  try {
    const d = await (await fetch("api/pairing", {cache: "no-store"})).json();
    $("#sheet").innerHTML = head(L("pc_list"), L("pc_list_tip")) +
      ((d.free || []).length ? d.free.map(c => codeCard(c) +
        `<p class="pcbtns"><button class="btn" data-pair="${esc(c.manual)}">${L("pa_code")}</button><button class="btn" data-pc="delete" data-key="${esc(c.key)}">${L("pc_delete")}</button></p>`).join("")
        : `<p class="mut" style="margin-top:14px">${L("pc_list_none")}</p>`) +
      `<p class="mut" style="margin-top:18px"><small>${esc(F("pc_count", {n: d.count || 0}))}</small></p>`;
    fillQr();
  } catch (e) { $("#sheet").innerHTML = head(L("pc_list")) + `<p class="mut">${L("error")}</p>`; }
}
async function pairClick(b) {
  if (b.dataset.pc === "replace") { pair.edit = true; return renderPair(); }
  if (b.dataset.pc === "scan") {   // the label of a node of the table, read by the app
    const id = pair.id, r = await scanQr(L("sc_close"));
    if (r.aborted === "timeout" || r.aborted === "error") toast(L("sc_none"));
    if (r.text && id) await pairPost({id, code: r.text}, "pc_saved");
    return;
  }
  if (b.dataset.pc === "delete" && confirm(L("pc_delete_confirm"))) {
    const list = !pair.id;
    if (await pairPost({delete: b.dataset.key}, "pc_deleted") && list) {   // the list closes with its last code
      await load(true);
      if (D.pair_free) openCodes(); else closeSheet();
    }
  }
}

// ------------------------------------------------------------ factory reset from a distance
// Asked in the panel itself, in two steps: what will happen (read from the node), then a box to
// tick. Only for a node whose pairing code is kept: without it the label is the only way back.
let resetBox = {id: null, html: ""};
function renderReset() {
  const el = $("#resetbox"); if (el) el.innerHTML = resetBox.id === openId ? resetBox.html : "";
}
async function nodeAction(id, action) {
  return await (await fetch("api/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({id, action})})).json();
}
async function resetAsk(id) {
  const r = (D.rows || []).find(x => x.id === id); if (!r) return;
  const box = html => { resetBox = {id, html: `<div class="advice bad">${IC.bad}<div>${html}</div></div>`}; renderReset(); };
  box(esc(L("loading")));
  let info = null;
  try { info = await nodeAction(id, "reset_info"); } catch (e) { /* told below */ }
  if (!info || !info.ok) return box(`<b>${esc(F("rs_noanswer", {n: r.name}))}</b><p class="pcbtns"><button class="btn" data-rs="cancel">${L("rs_close")}</button></p>`);
  if (!info.manual) return box(`<b>${esc(L("rs_nocode"))}</b><p class="pcbtns"><button class="btn" data-rs="cancel">${L("rs_close")}</button></p>`);
  box(`<b>${esc(F("rs_title", {n: r.name}))}</b><br>${esc(F("rs_text", {f: info.fabrics.join(", "), c: manualFmt(info.manual)}))}
    ${isRouter(r) ? `<br><br>${esc(L("rs_router"))}` : ""}
    <label class="rsok"><input type="checkbox" id="rsok"> ${esc(L("rs_check"))}</label>
    <p class="pcbtns"><button class="btn danger" data-rs="go" disabled>${L("rs_go")}</button><button class="btn" data-rs="cancel">${L("rs_cancel")}</button></p>`);
}
async function resetGo(b) {
  const id = resetBox.id, r = (D.rows || []).find(x => x.id === id); if (!r) return;
  b.disabled = true; b.classList.add("busy");
  let res = null;
  try { res = await nodeAction(id, "reset"); } catch (e) { /* told below */ }
  const k = res && res.ok && ["reset", "unsure", "partial", "noanswer", "nocode", "busy"].includes(res.result) ? res.result : "failed";
  toast(F("rs_r_" + k, {n: r.name, f: ((res && res.fabrics) || []).join(", ")}) + (res && res.listed ? " " + L("rs_listed") : ""));
  resetBox = {id: null, html: ""};
  await load(true);
  if (k === "reset" || k === "unsure") openCodes(); else renderReset();   // its code now waits in the list: what is needed to pair it again
}

async function openReport() {
  openSheet(head(L("report"), L("report_tip")) + `<p class="mut">${L("loading")}</p>`);
  try {
    const txt = await (await fetch("api/report", {cache: "no-store"})).text();
    $("#sheet").innerHTML = head(L("report"), L("report_tip")) +
      `<p style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="rcopy">${L("copy")}</button><button class="btn" id="rdl">${L("download")}</button></p><textarea id="rtext" readonly></textarea>`;
    $("#rtext").value = txt;
    $("#rcopy").onclick = async () => {
      try { await navigator.clipboard.writeText(txt); } catch (e) { $("#rtext").select(); document.execCommand("copy"); }
      $("#rcopy").textContent = L("copied");
    };
    $("#rdl").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([txt], {type: "text/markdown"}));
      a.download = "mesh-guardian-report.md"; document.body.appendChild(a); a.click(); a.remove();
    };
  } catch (e) { $("#sheet").innerHTML = head(L("report")) + `<p class="mut">${L("error")}</p>`; }
}

// ------------------------------------------------------------ loading
function texts() {
  document.documentElement.lang = LANG;
  $("#refresh span").textContent = L("refresh"); $("#refresh").title = L("refresh");
  $("#report span").textContent = L("report"); $("#report").title = L("report_tip");
  $("#codes span").textContent = L("pc_list"); $("#codes").title = L("pc_list_tip");
  $("#pairbtn span").textContent = L("pa_btn"); $("#pairbtn").title = L("pa_tip");
  $("#q").placeholder = L("search"); $("#q").setAttribute("aria-label", L("search"));
  $("#noteTitle").textContent = L("note_t"); $("#noteText").textContent = L("note");
  $("#sheet").setAttribute("aria-label", L("h_node"));
}
function renderAll() {
  if (!D) return;
  keepFocus(() => { renderHero(); renderTodo(); renderBrs(); renderList(); });
  $("#codes").style.display = D.pair_free ? "" : "none";   // only while a code waits for its device
  const rd = D.reading;
  $("#live").className = "live" + (D.live ? "" : " poll") + (rd && D.live ? " reading" : "");
  $("#live").title = rd ? (rd.total ? F("reading", {d: rd.done, n: rd.total}) : L("reading0"))
    : (D.live ? L("live") : L("polling"));
  // while the nodes are read again the time would be misleading: "updating…" until it ends
  // orange: connecting to the Matter Server; then green and blinking: the nodes are read again; then the time
  $("#live").innerHTML = `<i></i>${!D.live ? L("connecting") : rd ? (rd.total ? F("updating_n", {d: rd.done, n: rd.total}) : L("updating")) : F("updated", {t: hm(D.time)})}`;
  if (rd && !follow) follow = setTimeout(() => { follow = null; load(false); }, 5000);   // follow the reread
}
let follow = null;
async function reread() {   // page opened or Refresh: the add-on reads every node again (at most every 5 min)
  try { await fetch("api/reread", {method: "POST", cache: "no-store"}); } catch (e) { /* the table still loads */ }
}
let busy = false;
async function load(force) {
  if (busy) { while (busy) await new Promise(r => setTimeout(r, 100)); if (!force) return; }
  busy = true;
  if (force) $("#refresh").disabled = true;
  try {
    const r = await fetch("api/table" + (force ? "?force=1" : ""), {cache: "no-store"});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    // an unavailable node: nobody knows its link now, so nothing is shown rather than the
    // last values read before the outage (they looked current)
    d.rows = (d.rows || []).map(r => r.available ? r : {...r, parent: null, rssi: null, lqi: null, best_link: null,
      best_rssi: null, best_lqi: null, route: null, new_parent: null, rtt_ms: null, rtt_avg_ms: null, rtt_fail: false,
      access_point: null, channel: null});
    D = d; TH = d.thresholds || TH;
    if (d.lang && d.lang !== LANG) { LANG = d.lang; texts(); }
    theme(); renderAll();
  } catch (e) {
    $("#live").className = "live poll"; $("#live").innerHTML = `<i></i>${L("error")}: ${esc(e.message)}`;
    if (!D) $("#hero").innerHTML = `<div class="empty">${L("error")}: ${esc(e.message)}</div>`;
  } finally { busy = false; $("#refresh").disabled = false; }
}

// ------------------------------------------------------------ events
document.addEventListener("click", e => {
  const act = e.target.closest("button[data-act]");
  if (act) { e.stopPropagation(); if (!act.disabled) runAction(act); return; }
  const sn = e.target.closest("button[data-seen]");
  if (sn) {   // hide a note; the list only keeps the notes still shown
    P.seen = [...new Set([...(P.seen || []).filter(x => CARD_KEYS.has(x)), sn.dataset.seen])];
    save(); return renderTodo();
  }
  const pc = e.target.closest("button[data-pc]");
  if (pc) return pairClick(pc);
  const pa = e.target.closest("button[data-pair]");
  if (pa) return pairStart(pa.dataset.pair);
  const rs = e.target.closest("button[data-reset],button[data-rs]");
  if (rs) {
    if (rs.disabled) return;
    if (rs.dataset.reset) return resetAsk(rs.dataset.reset);
    if (rs.dataset.rs === "go") return resetGo(rs);
    resetBox = {id: null, html: ""}; return renderReset();
  }
  const cp = e.target.closest("button[data-copy]");
  if (cp) {
    navigator.clipboard.writeText(cp.dataset.copy).then(() => { cp.textContent = L("copied"); }, () => toast(cp.dataset.copy, true));
    return;
  }
  const rm = e.target.closest("#brRemove");
  if (rm) { if (!rm.disabled) removeBr(rm.dataset.brid); return; }
  const t = e.target.closest("[data-id],[data-br],[data-f],[data-sort],.x");
  if (!t) return;
  if (t.dataset.br) return openBr(t.dataset.br);
  if (t.dataset.sort) {   // ascending, descending, then back to "problems first"
    const k = t.dataset.sort;
    P.sort = !P.sort || P.sort.k !== k ? {k, d: 1} : {k, d: -P.sort.d};   // 2 states; default order from the column menu
    save(); return renderList();
  }
  if (t.classList.contains("x")) return closeSheet();
  if (t.dataset.f) {   // "All" also clears the text filter: one click shows every node again
    P.filter = t.dataset.f;
    if (P.filter === "all") { P.q = ""; $("#q").value = ""; }
    save(); return renderList();
  }
  if (t.dataset.id) return openNode(t.dataset.id);
});
$("#scrim").addEventListener("click", closeSheet);
$("#sheet").addEventListener("submit", async e => {   // name of a Wi-Fi access point
  const f = e.target.closest(".apf"); if (!f) return;
  e.preventDefault();
  const b = f.querySelector("button"); b.disabled = true;
  try {
    const r = await fetch("api/ap_name", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({bssid: f.dataset.bssid, name: f.n.value})});
    b.textContent = r.ok ? L("saved") : L("error");
    if (r.ok) load(true);
  } catch (err) { b.textContent = L("error"); }
  finally { b.disabled = false; }
});
$("#sheet").addEventListener("submit", e => {   // pairing code typed, or a kept code given to this node
  const nm = e.target.closest(".nmf");
  if (nm) { e.preventDefault(); return nameSave(nm); }
  const f = e.target.closest(".pcf,.pca"); if (!f || !pair.id) return;
  e.preventDefault();
  if (f.classList.contains("pca")) pairPost({id: pair.id, attach: f.k.value}, "pc_saved");
  else if (f.c.value.trim()) pairPost({id: pair.id, code: f.c.value}, "pc_saved");
});
// a photo is being chosen or taken: until the page has the focus back
$("#sheet").addEventListener("click", e => { const l = e.target.closest("label"); if (l && l.querySelector("input[type=file]")) fileOpen = true; }, true);
window.addEventListener("focus", () => setTimeout(() => { fileOpen = false; }, 1500));
// a section folded or unfolded stays so, for every panel ("toggle" does not bubble: caught on its way down)
$("#sheet").addEventListener("toggle", e => {
  const key = e.target.dataset && e.target.dataset.sec;
  if (!key || secOpen(key, null) === e.target.open) return;
  P.sec = {...(P.sec || {}), [key]: e.target.open}; save();
}, true);
$("#sheet").addEventListener("change", e => {
  if (e.target.matches(".pcdrop input[type=file]")) { fileOpen = false; pairPhoto(e.target.files[0]); }
  if (e.target.id === "rsok") { const go = $('#sheet button[data-rs="go"]'); if (go) go.disabled = !e.target.checked; }
});
// a photo dropped anywhere on the panel while it asks for a code, or pasted
$("#sheet").addEventListener("dragover", e => { const d = $("#sheet .pcdrop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
$("#sheet").addEventListener("dragleave", e => { const d = $("#sheet .pcdrop"); if (d && !$("#sheet").contains(e.relatedTarget)) d.classList.remove("over"); });
$("#sheet").addEventListener("drop", e => {
  const d = $("#sheet .pcdrop"); if (!d) return;
  e.preventDefault(); d.classList.remove("over");
  pairPhoto([...(e.dataTransfer.files || [])].find(f => f.type.startsWith("image/")));
});
document.addEventListener("paste", e => {
  if (!$("#sheet").classList.contains("on") || !$("#sheet .pcdrop")) return;
  const f = [...(e.clipboardData.files || [])].find(x => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); pairPhoto(f); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if ($("#colmenu").classList.contains("on")) toggleColMenu(false); else closeSheet(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".br[data-br]")) { e.preventDefault(); openBr(e.target.dataset.br); }
  if (e.key === "Tab") trapTab(e);
});
$("#q").value = P.q;
$("#q").addEventListener("input", () => { P.q = $("#q").value; save(); if (D) renderList(); });
$("#refresh").addEventListener("click", async () => { await reread(); load(true); });
$("#report").addEventListener("click", openReport);
$("#codes").addEventListener("click", openCodes);
$("#pairbtn").addEventListener("click", () => pairStart());
const layout = () => {
  const was = document.body.classList.contains("narrow");
  document.body.classList.toggle("narrow", window.innerWidth <= 760);
  if (D && was !== document.body.classList.contains("narrow")) renderList();
};
window.addEventListener("resize", layout);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", theme);
layout(); theme(); texts();
$("#loading").textContent = L("loading");
reread().then(() => load(false));
setInterval(() => { if (!document.hidden) load(false); }, 60000);
setInterval(() => { if (D && !document.hidden) keepFocus(() => { renderHero(); renderTodo(); renderBrs(); renderList(); }); }, 30000);
</script>
</body>
