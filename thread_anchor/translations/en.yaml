---
configuration:
  language:
    name: "Language"
    description: "Language of the log."
  omr_prefix:
    name: "OMR prefix to anchor"
    description: "/64 prefix the border router is kept on. Take the one the network uses now (Mesh Guardian shows it, or the Favored OMR prefix entity): the devices keep their addresses. Empty: the border router is only watched."
  omr_preference:
    name: "Preference"
    description: "high (default) or med: above the prefixes the border routers generate themselves (low)."
  otbr_addon:
    name: "Border router app"
    description: "Slug of the OpenThread Border Router app."
  check_interval:
    name: "Check every (s)"
    description: "Seconds between two readings of the border router. A restart of the border router is seen at once anyway."
  debug:
    name: "Debug"
    description: "More details in the log."
