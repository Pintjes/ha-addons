---
configuration:
  language:
    name: "Language"
    description: "Language of the log."
  server:
    name: "USB/IP server"
    description: "Address of the computer that shares the devices (usbipd-win on Windows)."
  server_port:
    name: "Server port"
    description: "Leave empty: 3240."
  devices:
    name: "Devices"
    description: "One entry per device: name, and hardware_id (VID:PID, as usbipd list shows it) or bus_id."
  check_interval:
    name: "Check every (s)"
    description: "Seconds between two checks of the link."
  restart_addons:
    name: "Add-ons to restart"
    description: "Restarted after the device is attached again, e.g. core_openthread_border_router."
  omr_prefix:
    name: "Fixed OMR prefix"
    description: "/64 prefix the OpenThread border router is kept on (e.g. the current OMR prefix of the network). Empty: nothing done."
  omr_preference:
    name: "OMR prefix preference"
    description: "high (default) or med: above the prefixes generated by the other border routers (low)."
  otbr_addon:
    name: "Border router add-on"
    description: "Leave empty: core_openthread_border_router."
  debug:
    name: "Debug"
    description: "More details in the log."
