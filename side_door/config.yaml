name: Side Door
version: "1.3.0"
slug: side_door
url: https://github.com/Pintjes/ha-addons
description: >-
  Opens web apps of your local network in the Home Assistant sidebar:
  HTTPS and Home Assistant login for free, nothing exposed to the Internet.
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8792
panel_icon: mdi:door-open
panel_title: Side Door
options:
  target_url: ""
  apps: []
  rewrite_paths: true
  rewrite_prefixes: []
  inject_script: false
  max_body_mb: 100
  timeout: 120
schema:
  target_url: str?
  apps:
    - name: str
      url: str
  rewrite_paths: bool
  rewrite_prefixes:
    - str
  inject_script: bool
  max_body_mb: int(1,10000)
  timeout: int(10,3600)
