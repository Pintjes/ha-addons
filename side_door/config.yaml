name: Side Door
version: "2.1.0"
slug: side_door
url: https://github.com/Pintjes/ha-addons
description: >-
  Opens web apps of your local network in the Home Assistant sidebar:
  HTTPS and Home Assistant login for free, nothing exposed to the Internet.
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8792
panel_icon: mdi:door-open
panel_title: Side Door
options:
  target_url: ""
  apps: []
  rewrite_prefixes: []
  max_body_mb: 100
  timeout: 120
schema:
  target_url: str?
  apps:
    - name: str
      url: str
      start: str?
      headers: password?
      hidden: bool?
      rewrite: bool?
      inject_script: bool?
      hide_proxy: bool?
      verify_tls: list(auto|on|off)?
  rewrite_prefixes:
    - str
  max_body_mb: int(1,10000)
  timeout: int(10,3600)
