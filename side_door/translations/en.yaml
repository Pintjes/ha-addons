---
configuration:
  target_url:
    name: Address of the app
    description: "For a single app: the address Home Assistant uses to reach it, for example http://192.168.1.10:8000."
  apps:
    name: Several apps
    description: "One entry per app: the name of its tab and its address are enough, and when this list is filled the address above is ignored. The other settings are explained in the Documentation tab."
  rewrite_prefixes:
    name: More texts to rewrite
    description: "Advanced. Text found right before a path starting with / that Side Door does not rewrite by itself, for example data-url=\"."
  auto_settings:
    name: Automatic detection
    description: "Looks for the start page of each app at each start: apply (default) uses it, report only writes it in the Log tab, off sends no request. hide_proxy, headers and verify_tls are never set automatically (see the Documentation tab)."
  max_body_mb:
    name: Largest upload (MB)
    description: Largest file that can be sent to the app.
  timeout:
    name: Timeout (s)
    description: How long to wait for an answer of the app. Also closes a silent WebSocket.
