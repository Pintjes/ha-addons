---
configuration:
  target_url:
    name: "Adresse de l'application"
    description: "Pour une seule application : l'adresse par laquelle Home Assistant la joint, par exemple http://192.168.1.10:8000."
  apps:
    name: "Plusieurs applications"
    description: "Une entrée par application : le nom de son onglet et son adresse suffisent, et quand cette liste est remplie l'adresse ci-dessus est ignorée. Les autres réglages sont expliqués dans l'onglet Documentation."
  rewrite_prefixes:
    name: "Autres textes à réécrire"
    description: "Avancé. Texte placé juste avant un chemin commençant par / que Side Door ne réécrit pas de lui-même, par exemple data-url=\"."
  auto_settings:
    name: "Détection automatique"
    description: "Cherche à chaque démarrage la page de départ de chaque application : apply (par défaut) l'utilise, report l'indique seulement dans l'onglet Journal, off n'envoie aucune requête. hide_proxy, headers et verify_tls ne sont jamais réglés automatiquement (voir l'onglet Documentation)."
  max_body_mb:
    name: "Envoi maximal (Mo)"
    description: "Taille maximale d'un fichier envoyé à l'application."
  timeout:
    name: "Délai d'attente (s)"
    description: "Temps d'attente d'une réponse de l'application. Ferme aussi un WebSocket silencieux."
