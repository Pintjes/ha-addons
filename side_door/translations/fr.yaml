---
configuration:
  target_url:
    name: "Adresse de l'application"
    description: "Pour une seule application : l'adresse par laquelle Home Assistant la joint, par exemple http://192.168.1.10:8000."
  apps:
    name: "Plusieurs applications"
    description: "Une entrée par application, avec le nom affiché sur son onglet et son adresse. « start », facultatif : la page sur laquelle l'onglet s'ouvre, quand ce n'est pas la racine de l'application (web/index.html pour Plex). « headers », facultatif : en-têtes envoyés à l'application à chaque requête, écrits "Nom: valeur" et séparés par " | ", pour une application placée derrière une passerelle qui laisse passer un jeton. À partir de deux applications, le panneau affiche une rangée d'onglets. Quand cette liste est remplie, l'adresse ci-dessus est ignorée."
  rewrite_paths:
    name: "Réécrire les chemins"
    description: "Nécessaire quand l'application utilise des chemins commençant par / (la plupart). À désactiver pour une application qui gère déjà l'en-tête X-Ingress-Path."
  rewrite_prefixes:
    name: "Autres textes à réécrire"
    description: "Avancé. Texte placé juste avant un chemin commençant par / que l'add-on ne réécrit pas de lui-même, par exemple data-url=\"."
  inject_script:
    name: "Injecter un script (expérimental)"
    description: "Pour les applications qui construisent leurs adresses en JavaScript et restent vides ou sortent du panneau. Un script chargé avant l'application déplace ces adresses sous le chemin de l'ingress. À laisser désactivé si l'application fonctionne sans."
  hide_proxy:
    name: "Cacher le relais aux applications"
    description: "Pour les applications qui demandent une connexion à travers Side Door mais pas sur le réseau local (Plex, par exemple) : elles considèrent qu'une requête relayée vient de l'extérieur. L'application ne voit alors que l'adresse de Home Assistant."
  max_body_mb:
    name: "Envoi maximal (Mo)"
    description: "Taille maximale d'un fichier envoyé à l'application."
  timeout:
    name: "Délai d'attente (s)"
    description: "Temps d'attente d'une réponse de l'application. Ferme aussi un WebSocket silencieux."
