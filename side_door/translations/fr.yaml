---
configuration:
  target_url:
    name: "Adresse de l'application"
    description: "Pour une seule application : l'adresse par laquelle Home Assistant la joint, par exemple http://192.168.1.10:8000."
  apps:
    name: "Plusieurs applications"
    description: "Une entrée par application, avec le nom affiché sur son onglet et son adresse. « start », facultatif : la page sur laquelle l'onglet s'ouvre, quand ce n'est pas la racine de l'application (web/index.html pour Plex). « headers », facultatif : en-têtes envoyés à l'application à chaque requête, écrits « Nom: valeur » et séparés par « | », pour une application placée derrière une passerelle qui laisse passer un jeton. « hidden », facultatif : l'application est mise de côté, elle n'a pas d'onglet et n'est pas chargée. Facultatifs, pour les applications qui en ont besoin : « rewrite » (activé par défaut ; à désactiver pour une application qui gère déjà l'en-tête X-Ingress-Path), « inject_script » (pour une application qui construit ses adresses en JavaScript et reste vide ou sort du panneau), « hide_proxy » (pour une application qui demande une connexion à travers Side Door mais pas sur le réseau local), « verify_tls » (auto par défaut : le certificat d'une adresse https est vérifié quand l'application est désignée par un nom, pas par une adresse IP ; on ou off pour trancher). À partir de deux applications, le panneau affiche une rangée d'onglets. Quand cette liste est remplie, l'adresse ci-dessus est ignorée."
  rewrite_prefixes:
    name: "Autres textes à réécrire"
    description: "Avancé. Texte placé juste avant un chemin commençant par / que l'add-on ne réécrit pas de lui-même, par exemple data-url=\"."
  max_body_mb:
    name: "Envoi maximal (Mo)"
    description: "Taille maximale d'un fichier envoyé à l'application."
  timeout:
    name: "Délai d'attente (s)"
    description: "Temps d'attente d'une réponse de l'application. Ferme aussi un WebSocket silencieux."
